<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1d2029"/>
  <!-- hazard stripe base -->
  <g fill="#ffb300">
    <rect x="0" y="14" width="3" height="2"/>
    <rect x="4" y="14" width="3" height="2"/>
    <rect x="8" y="14" width="3" height="2"/>
    <rect x="12" y="14" width="3" height="2"/>
  </g>
  <!-- cardboard box -->
  <rect x="3" y="4" width="10" height="9" fill="#c08a45"/>
  <rect x="3" y="4" width="10" height="2" fill="#d99d55"/>
  <rect x="7" y="4" width="2" height="9" fill="#e0c48a"/>
  <rect x="3" y="8" width="10" height="1" fill="#a5712f"/>
  <!-- shipping label -->
  <rect x="9" y="9" width="3" height="3" fill="#f2ede0"/>
</svg>
